trigger:
- main

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: ACR_NAME
  value: crformation
- name: IMAGE_REPO
  value: crformation.azurecr.io/devops-formation-frontend

stages:

# ─────────────────────────────────────────────
# STAGE 0 : Setup – Compute Image Tag
# ─────────────────────────────────────────────
- stage: SetupTag
  displayName: 'Setup – Compute Image Tag'
  jobs:
  - job: ComputeTag
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e

        # Tag format: {shortsha}-{branchslug}-{timestamp}
        SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)

        BRANCH_SLUG=$(echo "$(Build.SourceBranchName)" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's|[^a-z0-9]|-|g; s|-\+|-|g; s|^-||; s|-$||' \
          | cut -c1-20)

        TIMESTAMP=$(date -u +%Y%m%d%H%M)

        IMAGE_TAG="${SHORT_SHA}-${BRANCH_SLUG}-${TIMESTAMP}"

        echo "IMAGE_TAG: $IMAGE_TAG"
        # Propagate as Build.BuildNumber → accessible in all subsequent stages
        echo "##vso[build.updatebuildnumber]$IMAGE_TAG"
      displayName: 'Compute image tag (sha-branchslug-ts)'

# ─────────────────────────────────────────────
# STAGE 1 : Gitleaks – Secret Scanning
# ─────────────────────────────────────────────
- stage: Gitleaks
  displayName: 'Gitleaks – Secret Scanning'
  dependsOn: SetupTag
  jobs:
  - job: GitleaksJob
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e
        GITLEAKS_VERSION="8.18.0"
        wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        chmod +x gitleaks
        ./gitleaks detect --source . --verbose --exit-code 1
      displayName: 'Run Gitleaks'

# ─────────────────────────────────────────────
# STAGE 2 : Lint
# ─────────────────────────────────────────────
- stage: Lint
  displayName: 'Lint'
  dependsOn: Gitleaks
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      inputs:
        command: custom
        customCommand: 'run lint'

# ─────────────────────────────────────────────
# STAGE 3 : Unit Tests
# ─────────────────────────────────────────────
- stage: UnitTests
  displayName: 'Unit Tests'
  dependsOn: Lint
  jobs:
  - job: UnitTestsJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      inputs:
        command: custom
        customCommand: 'test -- --ci --reporters=default --reporters=jest-junit'
      env:
        CI: 'true'
        JEST_JUNIT_OUTPUT_DIR: '$(System.DefaultWorkingDirectory)/test-results'
        JEST_JUNIT_OUTPUT_NAME: 'junit.xml'

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '**/test-results/junit.xml'

    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/coverage'
        ArtifactName: 'coverage-report'

# ─────────────────────────────────────────────
# STAGE 4 : Mutation Tests (Stryker)
# ─────────────────────────────────────────────
- stage: MutationTests
  displayName: 'Mutation Tests'
  dependsOn: UnitTests
  jobs:
  - job: MutationTestsJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      displayName: 'Stryker – Mutation Testing'
      inputs:
        command: custom
        customCommand: 'run mutation-test'

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – stryker-report'
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/reports/mutation/mutation.html'
        ArtifactName: 'mutation-test-report'

# ─────────────────────────────────────────────
# STAGE 5 : SonarQube
# ─────────────────────────────────────────────
- stage: Sonar
  displayName: 'SonarQube Analysis'
  dependsOn: MutationTests
  jobs:
  - job: SonarJob
    steps:
    - checkout: self
      fetchDepth: 0

    - task: DownloadBuildArtifacts@1
      displayName: 'Download coverage report'
      inputs:
        artifactName: 'coverage-report'
        downloadPath: '$(System.DefaultWorkingDirectory)'

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      displayName: 'Install sonar-scanner'
      inputs:
        command: custom
        customCommand: 'install -g sonarqube-scanner'

    - task: Npm@1
      displayName: 'npm install'
      inputs:
        command: install

    - script: |
        ls -la $(System.DefaultWorkingDirectory)/coverage-report/
        sonar-scanner \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/coverage-report/lcov.info \
          -Dsonar.qualitygate.wait=true
      displayName: 'SonarQube Scan'
      env:
        SONAR_HOST_URL: $(SONAR_HOST_URL)
        SONAR_TOKEN: $(SONAR_TOKEN)

# ─────────────────────────────────────────────
# STAGE 6 : Docker Build
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: Sonar
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: DockerBuildJob
    steps:
    - task: AzureCLI@2
      displayName: 'Docker Build → save tar'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)
          docker build -t $(IMAGE) .
          docker save $(IMAGE) -o $(Build.ArtifactStagingDirectory)/image.tar

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – image.tar'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE 7 : Trivy Security Scan
# ─────────────────────────────────────────────
- stage: Trivy
  displayName: 'Trivy Security Scan'
  dependsOn: DockerBuild
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: TrivyJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - script: docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
      displayName: 'Docker Load Image'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format table \
          $(IMAGE)
      displayName: 'Trivy – Scan (fail on HIGH/CRITICAL)'

    - script: |
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format json \
          --output $(Build.ArtifactStagingDirectory)/trivy-report.json \
          $(IMAGE)
      displayName: 'Trivy – Export JSON Report'
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – trivy-report.json'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
        ArtifactName: 'trivy-report'

# ─────────────────────────────────────────────
# STAGE 8 : Push Docker Image → ACR
# ─────────────────────────────────────────────
- stage: PushDocker
  displayName: 'Push Docker Image → ACR'
  dependsOn: Trivy
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: PushDockerJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - task: AzureCLI@2
      displayName: 'Docker Load & Push → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
          az acr login --name $(ACR_NAME)
          docker push $(IMAGE)

# ─────────────────────────────────────────────
# STAGE 9 : Push Helm Chart → ACR (OCI)
# ─────────────────────────────────────────────
- stage: PushHelm
  displayName: 'Push Helm Chart → ACR'
  dependsOn: PushDocker
  jobs:
  - job: PushHelmJob
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Helm Package & Push → ACR OCI'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)

          CHART_NAME=$(grep '^name:' helm/front/Chart.yaml | awk '{print $2}')
          CHART_VERSION=$(grep '^version:' helm/front/Chart.yaml | awk '{print $2}')

          helm package ./helm/front --app-version $(Build.BuildNumber)
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" oci://crformation.azurecr.io/helm
