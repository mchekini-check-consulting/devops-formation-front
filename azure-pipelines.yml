trigger:
- main

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

variables:
- group: variable

stages:

# ─────────────────────────────────────────────
# STAGE 1 : Gitleaks (CLI)
# ─────────────────────────────────────────────
- stage: Gitleaks
  displayName: 'Gitleaks – Secret Scanning'
  jobs:
  - job: GitleaksJob
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e

        GITLEAKS_VERSION="8.18.0"

        wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

        tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

        chmod +x gitleaks

        ./gitleaks detect --source . --verbose --exit-code 1
      displayName: 'Run Gitleaks (fixed install)'

# ─────────────────────────────────────────────
# STAGE 2 : Install & Lint
# ─────────────────────────────────────────────
- stage: Lint
  dependsOn: Gitleaks
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      inputs:
        command: custom
        customCommand: 'run lint'

# ─────────────────────────────────────────────
# STAGE 3 : Unit Tests
# ─────────────────────────────────────────────
- stage: UnitTests
  dependsOn: Lint
  jobs:
  - job: UnitTestsJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      inputs:
        command: custom
        customCommand: 'test -- --ci --reporters=default --reporters=jest-junit'
      env:
        CI: 'true'
        JEST_JUNIT_OUTPUT_DIR: '$(System.DefaultWorkingDirectory)/test-results'
        JEST_JUNIT_OUTPUT_NAME: 'junit.xml'

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '**/test-results/junit.xml'

    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/coverage'
        ArtifactName: 'coverage-report'

# ─────────────────────────────────────────────
# STAGE 4 : OWASP Dependency Check (CLI)
# ─────────────────────────────────────────────
# Désactivé – nécessite la tâche marketplace dependency-check-build-task@6

# ─────────────────────────────────────────────
# STAGE 5 : SonarQube (CLI version)
# ─────────────────────────────────────────────
- stage: Sonar
  displayName: 'SonarQube Analysis'
  dependsOn: UnitTests
  jobs:
  - job: SonarJob
    displayName: 'Sonar Scan'
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download coverage report'
      inputs:
        artifactName: 'coverage-report'
        downloadPath: '$(Pipeline.Workspace)/coverage'

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      displayName: 'npm install + sonar-scanner'
      inputs:
        command: custom
        customCommand: 'install -g sonarqube-scanner'

    - task: Npm@1
      displayName: 'npm install'
      inputs:
        command: install

    - script: |
        sonar-scanner \
          -Dsonar.host.url=$(SONAR_HOST_URL) \
          -Dsonar.token=$(SONAR_TOKEN) \
          -Dsonar.javascript.lcov.reportPaths=$(Pipeline.Workspace)/coverage/coverage-report/lcov.info
      displayName: 'SonarQube Scan'

# ─────────────────────────────────────────────
# STAGE 6 : Build
# ─────────────────────────────────────────────
- stage: Build
  dependsOn: Sonar
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: Npm@1
      inputs:
        command: install

    - task: Npm@1
      inputs:
        command: custom
        customCommand: 'run build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'build'
        ArtifactName: 'build'

# ─────────────────────────────────────────────
# STAGE 7 : Docker Build
# ─────────────────────────────────────────────
- stage: DockerBuild
  dependsOn: Build
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-frontend:$(Build.BuildId)
  jobs:
  - job: DockerBuildJob
    steps:
    - checkout: self
    - script: |
        az acr login --name crformation
        docker build -t $(IMAGE) .
        docker save $(IMAGE) -o $(Build.ArtifactStagingDirectory)/image.tar
      displayName: 'Docker build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE 8 : Trivy
# ─────────────────────────────────────────────
- stage: Trivy
  dependsOn: DockerBuild
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-frontend:$(Build.BuildId)
  jobs:
  - job: TrivyJob
    steps:
    - script: |
        docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar

        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

        trivy image --exit-code 1 --severity HIGH,CRITICAL $(IMAGE)
      displayName: 'Trivy scan'

# ─────────────────────────────────────────────
# STAGE 9 : Push
# ─────────────────────────────────────────────
- stage: Push
  dependsOn: Trivy
  variables:
    IMAGE: crformation.azurecr.io/devops-formation-frontend:$(Build.BuildId)
  jobs:
  - job: PushJob
    steps:
    - script: |
        docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
        az acr login --name crformation
        docker push $(IMAGE)
      displayName: 'Push to ACR'