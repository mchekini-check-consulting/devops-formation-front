services:
  # ── Reverse Proxy ────────────────────────────────────────────

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - catalogue-service
      - order-service
      - payment-service
    restart: unless-stopped
    networks:
      - backend

  # ── Databases ─────────────────────────────────────────────────

  catalogue-db:
    image: postgres:17-alpine
    command: -p 5434
    environment:
      POSTGRES_DB: catalogue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5434"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - catalogue_pgdata:/var/lib/postgresql/data
    networks:
      - backend

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    networks:
      - backend

  payment-db:
    image: postgres:18
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - payment_pgdata:/var/lib/postgresql/pgdata
    networks:
      - backend

  # ── Backend services ──────────────────────────────────────────

  catalogue-service:
    image: jubatouam/ecommerce-catalogue:latest
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: catalogue-db
      DB_PORT: 5434
      DB_NAME: catalogue_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      catalogue-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  order-service:
    image: jubatouam/ecommerce-order:latest
    command: >
      sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: prod-secret-key-change-me
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,nginx-proxy,${VM_HOST:-localhost}
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: orders-db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://${VM_HOST:-localhost}
    depends_on:
      orders-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  payment-service:
    image: jubatouam/ecommerce-payment:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      payment-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # ── Frontend ──────────────────────────────────────────────────

  frontend:
    image: jubatouam/ecommerce-frontend:latest
    environment:
      CATALOG: http://${VM_HOST:-localhost}/api/catalog
      ORDERS: http://${VM_HOST:-localhost}/api/orders/
      PAYMENT: http://${VM_HOST:-localhost}/api/payments
    depends_on:
      - catalogue-service
      - order-service
      - payment-service
    restart: unless-stopped
    networks:
      - backend

volumes:
  catalogue_pgdata:
  orders_pgdata:
  payment_pgdata:

networks:
  backend:
    driver: bridge
