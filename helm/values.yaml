image:
  repository: crformation.azurecr.io/devops-formation-frontend
  tag: "7.0"
  pullPolicy: Always

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: 0

affinity:
  nodepool: apps

service:
  type: ClusterIP
  port: 80

probes:
  path: /
  startup:
    periodSeconds: 5
    failureThreshold: 6
  liveness:
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

configmap:
  CATALOG: ""
  ORDERS: ""
  PAYMENT: ""
  AUTH_ENABLED: "false"

secret:
  enabled: false
  data: {}

initContainer:
  env: []

pdb:
  minAvailable: 1

hpa:
  minReplicas: 2
  maxReplicas: 4
  cpu:
    averageUtilization: 70
  memory:
    averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      percent: 100
      periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      percent: 25
      periodSeconds: 60

vpa:
  updateMode: "Off"

rollout:
  enabled: false
  strategy:
    blueGreen:
      activeService: front
      previewService: front-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 600

ingress:
  enabled: true
  name: ecommerce-ingress
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  routes:
    - path: /
      pathType: Prefix
      service:
        name: front
        port: 80
