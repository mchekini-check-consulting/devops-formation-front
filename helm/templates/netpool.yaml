apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-front
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.netpolicies.ingresssources  }}
      ports:
        - port: {{ .Values.netpolicies.ingressdestports }}
          protocol: {{ .Values.netpolicies.ingressprotocol }}