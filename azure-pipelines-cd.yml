# CD Pipeline — GitOps (pull model)
#
# Deux modes de fonctionnement :
#   1. Automatique : push sur main → build + scan + push ACR → update tag dans le repo gitops (dev)
#   2. Manuel      : choix de l'environnement (qualif/prod) + imageTag → update tag dans le repo gitops
#
# ArgoCD détecte le changement dans le repo gitops et déploie automatiquement.
#
# Variables requises dans le groupe 'variable' :
#   GITOPS_PAT — Personal Access Token avec accès au repo devops-formation-gitops

trigger:
  branches:
    include:
    - main

pr: none

parameters:
- name: environment
  displayName: "Environnement cible (qualif/prod uniquement)"
  type: string
  default: qualif
  values:
  - qualif
  - prod

- name: imageTag
  displayName: "Tag image existant dans ACR à promouvoir"
  type: string
  default: ' '

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: ACR_NAME
  value: crformation
- name: IMAGE_REPO
  value: crformation.azurecr.io/devops-formation-frontend
- name: GITOPS_REPO
  value: devops-formation-gitops
- name: APP_NAME
  value: front

stages:

# =============================================================
#  DEV FLOW : Build → Docker → Trivy → Push ACR → Update GitOps
#  Déclenché automatiquement au push sur main
# =============================================================

# ─────────────────────────────────────────────
# STAGE : Setup – Compute Image Tag
# ─────────────────────────────────────────────
- stage: SetupTag
  displayName: 'Setup – Compute Image Tag'
  condition: ne(variables['Build.Reason'], 'Manual')
  jobs:
  - job: ComputeTag
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e
        SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)

        RAW_BRANCH="$(Build.SourceBranchName)"
        BRANCH=$(echo "$RAW_BRANCH" | sed 's|refs/heads/||')

        BRANCH_SLUG=$(echo "$BRANCH" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's|[^a-z0-9]|-|g; s|-\+|-|g; s|^-||; s|-$||' \
          | cut -c1-20)

        TIMESTAMP=$(date -u +%Y%m%d%H%M)
        IMAGE_TAG="${SHORT_SHA}-${BRANCH_SLUG}-${TIMESTAMP}"

        echo "IMAGE_TAG: $IMAGE_TAG"
        echo "##vso[build.updatebuildnumber]$IMAGE_TAG"
      displayName: 'Compute image tag (sha-branchslug-ts)'
      env: {}

# ─────────────────────────────────────────────
# STAGE : Docker Build
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: [SetupTag]
  condition: and(succeeded('SetupTag'), ne(variables['Build.Reason'], 'Manual'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: DockerBuildJob
    steps:
    - task: AzureCLI@2
      displayName: 'Docker Build → save tar'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)
          docker build -t $(IMAGE) .
          docker save $(IMAGE) -o $(Build.ArtifactStagingDirectory)/image.tar

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – image.tar'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE : Trivy Security Scan
# ─────────────────────────────────────────────
- stage: Trivy
  displayName: 'Trivy Security Scan'
  dependsOn: DockerBuild
  condition: and(succeeded('DockerBuild'), ne(variables['Build.Reason'], 'Manual'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: TrivyJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - script: docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
      displayName: 'Docker Load Image'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format table \
          $(IMAGE)
      displayName: 'Trivy – Scan (fail on HIGH/CRITICAL)'

    - script: |
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format json \
          --output $(Build.ArtifactStagingDirectory)/trivy-report.json \
          $(IMAGE)
      displayName: 'Trivy – Export JSON Report'
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – trivy-report.json'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
        ArtifactName: 'trivy-report'

# ─────────────────────────────────────────────
# STAGE : Push Docker Image → ACR
# ─────────────────────────────────────────────
- stage: PushACR
  displayName: 'Push Docker Image → ACR'
  dependsOn: Trivy
  condition: and(succeeded('Trivy'), ne(variables['Build.Reason'], 'Manual'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: PushACRJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - task: AzureCLI@2
      displayName: 'Docker Load & Push → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
          az acr login --name $(ACR_NAME)
          docker push $(IMAGE)

# ─────────────────────────────────────────────
# STAGE : Update GitOps repo (dev)
# ─────────────────────────────────────────────
- stage: UpdateGitopsDev
  displayName: 'Update GitOps → dev'
  dependsOn: PushACR
  condition: and(succeeded('PushACR'), ne(variables['Build.Reason'], 'Manual'))
  jobs:
  - job: UpdateGitopsJob
    displayName: 'Update image tag in gitops repo'
    steps:
    - checkout: none

    - script: |
        set -e

        # Installer yq
        YQ_VERSION="4.44.1"
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        # Cloner le repo gitops (GitHub)
        git clone https://$(GITOPS_PAT)@github.com/mchekini-check-consulting/$(GITOPS_REPO).git /tmp/gitops
        cd /tmp/gitops

        # Mettre à jour le tag image
        VALUES_FILE="environments/dev/40-applications/$(APP_NAME)/values.yaml"
        echo "Updating ${VALUES_FILE} → image.tag = $(Build.BuildNumber)"
        yq e -i ".image.tag = \"$(Build.BuildNumber)\"" "${VALUES_FILE}"

        # Commit & push
        git config user.email "azure-pipelines[bot]@users.noreply.github.com"
        git config user.name "Azure Pipelines"
        git add "${VALUES_FILE}"
        git commit -m "chore($(APP_NAME)): update dev image tag to $(Build.BuildNumber)"
        git push origin main
      displayName: 'Clone gitops + yq update + push'

# =============================================================
#  QUALIF/PROD FLOW : Update GitOps (promote)
#  Déclenché manuellement
# =============================================================

# ─────────────────────────────────────────────
# STAGE : Update GitOps repo (qualif/prod)
# ─────────────────────────────────────────────
- stage: UpdateGitopsPromote
  displayName: 'Update GitOps → ${{ parameters.environment }}'
  condition: eq(variables['Build.Reason'], 'Manual')
  jobs:
  - deployment: PromoteGitops
    displayName: 'Promote image tag → ${{ parameters.environment }}'
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - script: |
              set -e

              IMAGE_TAG="${{ parameters.imageTag }}"
              IMAGE_TAG=$(echo "$IMAGE_TAG" | xargs)

              if [ -z "$IMAGE_TAG" ]; then
                echo "##[error] Le paramètre imageTag est requis pour qualif/prod."
                exit 1
              fi

              # Installer yq
              YQ_VERSION="4.44.1"
              sudo wget -qO /usr/local/bin/yq \
                https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
              sudo chmod +x /usr/local/bin/yq

              # Cloner le repo gitops (GitHub)
              git clone https://$(GITOPS_PAT)@github.com/mchekini-check-consulting/$(GITOPS_REPO).git /tmp/gitops
              cd /tmp/gitops

              # Mettre à jour le tag image
              VALUES_FILE="environments/${{ parameters.environment }}/40-applications/$(APP_NAME)/values.yaml"
              echo "Updating ${VALUES_FILE} → image.tag = ${IMAGE_TAG}"
              yq e -i ".image.tag = \"${IMAGE_TAG}\"" "${VALUES_FILE}"

              # Commit & push
              git config user.email "azure-pipelines[bot]@users.noreply.github.com"
              git config user.name "Azure Pipelines"
              git add "${VALUES_FILE}"
              git commit -m "chore($(APP_NAME)): promote ${{ parameters.environment }} image tag to ${IMAGE_TAG}"
              git push origin feat/postgres
            displayName: 'Clone gitops + yq update + push'
