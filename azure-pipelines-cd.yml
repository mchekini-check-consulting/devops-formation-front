# CD Pipeline – déclenché automatiquement sur push vers main
# L'opérateur peut aussi le lancer manuellement pour choisir l'env et le tag.
#
# Environments Azure DevOps à configurer dans le portail :
#   dev    → pas d'approbation
#   qualif → approbation recommandée
#   prod   → approbation obligatoire
#
# Variables requises dans le groupe 'variable' :
#   AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

trigger:
- main

parameters:
- name: environment
  displayName: "Environnement cible"
  type: string
  default: dev
  values:
  - dev
  - qualif
  - prod

- name: imageTag
  displayName: "Tag de l'image Docker (vide = dernier tag ACR)"
  type: string
  default: ''

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: ACR_NAME
  value: crformation
- name: IMAGE_REPO
  value: crformation.azurecr.io/devops-formation-frontend

stages:

# ─────────────────────────────────────────────
# STAGE 1 : Resolve Image Tag
# ─────────────────────────────────────────────
- stage: ResolveTag
  displayName: 'Resolve Image Tag'
  jobs:
  - job: ResolveTagJob
    steps:
    - task: AzureCLI@2
      displayName: 'Resolve image tag (param ou dernier ACR)'
      name: resolveTag
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          PARAM_TAG="${{ parameters.imageTag }}"

          if [ -n "$PARAM_TAG" ]; then
            DEPLOY_TAG="$PARAM_TAG"
            echo "Tag fourni : $DEPLOY_TAG"
          else
            # Aucun tag fourni → récupère le dernier poussé sur l'ACR
            az acr login --name $(ACR_NAME)
            DEPLOY_TAG=$(az acr repository show-tags \
              --name $(ACR_NAME) \
              --repository devops-formation-frontend \
              --orderby time_desc \
              --top 1 \
              --output tsv)
            echo "Tag résolu depuis ACR : $DEPLOY_TAG"
          fi

          if [ -z "$DEPLOY_TAG" ]; then
            echo "##[error] Impossible de résoudre le tag image."
            exit 1
          fi

          echo "##vso[task.setvariable variable=DEPLOY_TAG;isOutput=true]$DEPLOY_TAG"

# ─────────────────────────────────────────────
# STAGE 2 : Deploy → environnement choisi
# ─────────────────────────────────────────────
- stage: Deploy_${{ parameters.environment }}
  displayName: 'Deploy → ${{ parameters.environment }}'
  dependsOn: ResolveTag
  variables:
    DEPLOY_TAG: $[ stageDependencies.ResolveTag.ResolveTagJob.outputs['resolveTag.DEPLOY_TAG'] ]
  jobs:

  - deployment: DeployHelm
    displayName: 'Helm Upgrade / Install'
    # Référence l'Environment Azure DevOps du même nom.
    # Les approval gates sont configurées dans le portail sur cet Environment.
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:

          # Checkout pour accéder aux values-{env}.yaml du repo
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Helm Deploy → ${{ parameters.environment }}'
            inputs:
              azureSubscription: 'sc-formation-devops-aks'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                # Lire le nom et la version du chart depuis Chart.yaml
                CHART_NAME=$(grep '^name:'    helm/front/Chart.yaml | awk '{print $2}')
                CHART_VERSION=$(grep '^version:' helm/front/Chart.yaml | awk '{print $2}')

                echo "Chart   : ${CHART_NAME}  version : ${CHART_VERSION}"
                echo "Image   : $(IMAGE_REPO):$(DEPLOY_TAG)"
                echo "Env     : ${{ parameters.environment }}"

                # Login ACR (image + OCI helm registry)
                az acr login --name $(ACR_NAME)

                # Récupérer le kubeconfig AKS
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) \
                  --overwrite-existing

                # Déploiement Helm depuis le registry OCI ACR
                helm upgrade --install "${CHART_NAME}" \
                  "oci://crformation.azurecr.io/helm/${CHART_NAME}" \
                  --version "${CHART_VERSION}" \
                  -f "helm/front/values.yaml" \
                  -f "helm/front/values-${{ parameters.environment }}.yaml" \
                  --set image.repository=$(IMAGE_REPO) \
                  --set image.tag=$(DEPLOY_TAG) \
                  --namespace ${{ parameters.environment }} \
                  --create-namespace \
                  --atomic \
                  --timeout 5m \
                  --wait