# CD Pipeline – déploiement manuel uniquement
#
# Environments Azure DevOps à configurer dans le portail :
#   dev    → pas d'approbation
#   qualif → approbation recommandée
#   prod   → approbation obligatoire
#
# Variables requises dans le groupe 'variable' :
#   AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME, SONAR_HOST_URL, SONAR_TOKEN

trigger:
  branches:
    include:
    - main

pr: none

parameters:
- name: environment
  displayName: "Environnement cible"
  type: string
  default: dev
  values:
  - dev
  - qualif
  - prod

- name: chartVersion
  displayName: "Version du chart Helm (requis pour qualif/prod, ex: 1.0.5821)"
  type: string
  default: ''

pool:
  vmImage: ubuntu-latest

variables:
- group: variable
- name: ACR_NAME
  value: crformation
- name: IMAGE_REPO
  value: crformation.azurecr.io/devops-formation-frontend
- name: HELM_OCI_REPO
  value: oci://crformation.azurecr.io/helm

stages:

# ─────────────────────────────────────────────
# STAGE 0 : Setup – Compute Image Tag (dev uniquement)
# ─────────────────────────────────────────────
- stage: SetupTag
  displayName: 'Setup – Compute Image Tag'
  condition: eq('${{ parameters.environment }}', 'dev')
  jobs:
  - job: ComputeTag
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e
        SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)

        RAW_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-$(Build.SourceBranchName)}"
        BRANCH=$(echo "$RAW_BRANCH" | sed 's|refs/heads/||')

        BRANCH_SLUG=$(echo "$BRANCH" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's|[^a-z0-9]|-|g; s|-\+|-|g; s|^-||; s|-$||' \
          | cut -c1-20)

        TIMESTAMP=$(date -u +%Y%m%d%H%M)
        IMAGE_TAG="${SHORT_SHA}-${BRANCH_SLUG}-${TIMESTAMP}"

        echo "IMAGE_TAG: $IMAGE_TAG"
        echo "##vso[build.updatebuildnumber]$IMAGE_TAG"
      displayName: 'Compute image tag (sha-branchslug-ts)'
      env:
        SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)

# ─────────────────────────────────────────────
# STAGE 1 : Validate
#   dev        → aucune vérification de chartVersion
#   qualif/prod → vérifie que chartVersion est fourni et existe dans l'ACR
# ─────────────────────────────────────────────
- stage: Validate
  displayName: 'Validate'
  dependsOn: []
  jobs:
  - job: ValidateJob
    steps:
    - ${{ if eq(parameters.environment, 'dev') }}:
      - script: echo "Environnement dev — build complet à venir, aucun chartVersion requis."
        displayName: 'Validate dev'

    - ${{ if ne(parameters.environment, 'dev') }}:
      - script: |
          if [ -z "${{ parameters.chartVersion }}" ]; then
            echo "##[error] chartVersion est obligatoire pour l'environnement ${{ parameters.environment }}."
            exit 1
          fi
          echo "chartVersion=${{ parameters.chartVersion }}"
        displayName: 'Vérifier chartVersion fourni'

      - task: AzureCLI@2
        displayName: 'Vérifier existence chart dans ACR'
        inputs:
          azureSubscription: 'sc-formation-devops-acr'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -e
            az acr login --name $(ACR_NAME)

            TAGS=$(az acr repository show-tags \
              --name $(ACR_NAME) \
              --repository helm/front \
              --output tsv)

            if echo "$TAGS" | grep -qx "${{ parameters.chartVersion }}"; then
              echo "Chart front:${{ parameters.chartVersion }} trouvé dans l'ACR ✅"
            else
              echo "##[error] Chart front:${{ parameters.chartVersion }} introuvable dans l'ACR."
              echo "Tags disponibles :"
              echo "$TAGS"
              exit 1
            fi

# ─────────────────────────────────────────────
# STAGE 2 : Docker Build (dev uniquement)
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: [SetupTag, Validate]
  condition: and(succeeded('SetupTag'), succeeded('Validate'), eq('${{ parameters.environment }}', 'dev'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: DockerBuildJob
    steps:
    - task: AzureCLI@2
      displayName: 'Docker Build → save tar'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)
          docker build -t $(IMAGE) .
          docker save $(IMAGE) -o $(Build.ArtifactStagingDirectory)/image.tar

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – image.tar'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/image.tar'
        ArtifactName: 'docker-image'

# ─────────────────────────────────────────────
# STAGE 3 : Trivy Security Scan (dev uniquement)
# ─────────────────────────────────────────────
- stage: Trivy
  displayName: 'Trivy Security Scan'
  dependsOn: DockerBuild
  condition: and(succeeded('DockerBuild'), eq('${{ parameters.environment }}', 'dev'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: TrivyJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - script: docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
      displayName: 'Docker Load Image'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format table \
          $(IMAGE)
      displayName: 'Trivy – Scan (fail on HIGH/CRITICAL)'

    - script: |
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          --no-progress \
          --format json \
          --output $(Build.ArtifactStagingDirectory)/trivy-report.json \
          $(IMAGE)
      displayName: 'Trivy – Export JSON Report'
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: 'Artifact – trivy-report.json'
      condition: always()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
        ArtifactName: 'trivy-report'

# ─────────────────────────────────────────────
# STAGE 4 : Push Docker Image → ACR (dev uniquement)
# ─────────────────────────────────────────────
- stage: PushACR
  displayName: 'Push Docker Image → ACR'
  dependsOn: Trivy
  condition: and(succeeded('Trivy'), eq('${{ parameters.environment }}', 'dev'))
  variables:
    IMAGE: $(IMAGE_REPO):$(Build.BuildNumber)
  jobs:
  - job: PushACRJob
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download image.tar'
      inputs:
        artifactName: 'docker-image'
        downloadPath: '$(Build.ArtifactStagingDirectory)'

    - task: AzureCLI@2
      displayName: 'Docker Load & Push → ACR'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          docker load -i $(Build.ArtifactStagingDirectory)/docker-image/image.tar
          az acr login --name $(ACR_NAME)
          docker push $(IMAGE)

# ─────────────────────────────────────────────
# STAGE 5 : Inject Tag + Package + Push Helm → ACR (dev uniquement)
# ─────────────────────────────────────────────
- stage: HelmPush
  displayName: 'Push Helm Chart → ACR'
  dependsOn: PushACR
  condition: and(succeeded('PushACR'), eq('${{ parameters.environment }}', 'dev'))
  jobs:
  - job: HelmPushJob
    steps:
    - checkout: self

    - script: |
        YQ_VERSION="4.44.1"
        sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
      displayName: 'Install yq'

    - script: |
        set -e
        CHART_VERSION="1.0.$(Build.BuildId)"

        yq e '.appVersion = "'"$(Build.BuildNumber)"'"' -i helm/front/Chart.yaml
        yq e '.version    = "'"${CHART_VERSION}"'"'     -i helm/front/Chart.yaml
        yq e '.image.tag  = "'"$(Build.BuildNumber)"'"' -i helm/front/values-dev.yaml

        echo "Chart.yaml :"
        cat helm/front/Chart.yaml
      displayName: 'Inject image tag → Chart.yaml + values-dev.yaml'

    - task: AzureCLI@2
      displayName: 'Helm Package & Push → ACR OCI'
      inputs:
        azureSubscription: 'sc-formation-devops-acr'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)

          CHART_NAME=$(yq e '.name'    helm/front/Chart.yaml)
          CHART_VERSION=$(yq e '.version' helm/front/Chart.yaml)

          helm package ./helm/front
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" $(HELM_OCI_REPO)

          echo "Poussé : ${CHART_NAME}-${CHART_VERSION} (appVersion=$(Build.BuildNumber))"

# ─────────────────────────────────────────────
# STAGE 6 : Deploy
#   dev        → attend HelmPush (build complet)
#   qualif/prod → attend uniquement Validate (chart existant dans l'ACR)
# ─────────────────────────────────────────────
- stage: Deploy
  displayName: 'Deploy → ${{ parameters.environment }}'
  dependsOn: [Validate, HelmPush]
  condition: |
    and(
      succeeded('Validate'),
      or(
        and(eq('${{ parameters.environment }}', 'dev'), succeeded('HelmPush')),
        and(ne('${{ parameters.environment }}', 'dev'), eq(dependencies.HelmPush.result, 'Skipped'))
      )
    )
  jobs:
  - deployment: DeployHelm
    displayName: 'Helm Upgrade / Install'
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'ACR Login'
            inputs:
              azureSubscription: 'sc-formation-devops-acr'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                az acr login --name $(ACR_NAME)

          - task: AzureCLI@2
            displayName: 'Helm Deploy → ${{ parameters.environment }}'
            inputs:
              azureSubscription: 'sc-formation-devops-aks'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                YQ_VERSION="4.44.1"
                sudo wget -qO /usr/local/bin/yq \
                  https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
                sudo chmod +x /usr/local/bin/yq

                if [ "${{ parameters.environment }}" = "dev" ]; then
                  CHART_VERSION="1.0.$(Build.BuildId)"
                else
                  CHART_VERSION="${{ parameters.chartVersion }}"
                fi

                helm pull "$(HELM_OCI_REPO)/front" \
                  --version "${CHART_VERSION}" \
                  --untar \
                  --untardir /tmp/helm-chart

                IMAGE_TAG=$(yq e '.appVersion' /tmp/helm-chart/front/Chart.yaml)

                echo "Chart     : front ${CHART_VERSION}"
                echo "Image tag : ${IMAGE_TAG}"
                echo "Env       : ${{ parameters.environment }}"

                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) \
                  --overwrite-existing

                helm upgrade --install front \
                  "$(HELM_OCI_REPO)/front" \
                  --version "${CHART_VERSION}" \
                  -f /tmp/helm-chart/front/values.yaml \
                  -f /tmp/helm-chart/front/values-${{ parameters.environment }}.yaml \
                  --set image.repository=$(IMAGE_REPO) \
                  --set image.tag="${IMAGE_TAG}" \
                  --namespace ${{ parameters.environment }} \
                  --create-namespace \
                  --atomic \
                  --timeout 5m \
                  --wait
